note: |
  Artificial Labs publishes no versioning policy, no deprecation policy, no SLA
  and no status page on any public surface. What it does publish is engineering
  intent: a company blog post, "Resilient REST APIs: The case for Parallel
  Change", that argues for expand/contract (parallel change) API evolution rather
  than breaking version bumps, and illustrates it with a policies collection. That
  is a stated philosophy, not a contractual policy, and is recorded as such.
  Release notes for Smart Underwriting, Smart Placement and Contract Builder are
  presumed to live inside the Auth0-gated Antora documentation site; nothing is
  readable without a customer login.
