note: |
  Two very different conformance stories sit on this record. The identity layer
  is verifiable in the open: a standards-complete OAuth 2.0 / OpenID Connect
  authorization server with discovery, PKCE, DPoP, device code, CIBA and token
  exchange advertised anonymously. The data/contract layer is verifiable only by
  the company's own published claims: Artificial is an ACORD Solutions Group
  Licensed Integrator Partner and builds Contract Builder and Smart Placement on
  a structured model incorporating MRC v3, ACORD GRLC and the Lloyd's Core Data
  Record, with pre-submission validation against MRCv3 and ACORD standards. No
  public artifact lets an outsider test the second claim, so it is recorded as
  claimed rather than verified.
