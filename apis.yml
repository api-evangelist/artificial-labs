name: Artificial Labs
kind: company
description: >-
  Artificial Labs is a London-based insurance technology company building
  algorithmic and digital underwriting software for the specialty and
  reinsurance market, with the Lloyd's of London subscription market as its
  home ground. Founded and headquartered in the City of London at 1-3
  Frederick's Place, and led by co-founders and co-CEOs David King and Johnny
  Bridges under chairman Martin Reith, the company sells three products to
  carriers, syndicates, MGAs and wholesale brokers: Smart Underwriting (a
  configurable lead-and-follow digital underwriting platform with appetite
  modelling and accept/refer/decline submission triage), Smart Placement (a
  broker-side placement and distribution platform) and Contract Builder
  (MRCv3-compliant structured digital contract creation, which powers PPL's
  integrated Digital Contract Capability). Named customers and partners
  include Apollo, PPL, BMS Group, Lockton and McGill and Partners, and the
  firm is an alumnus of the Lloyd's Lab accelerator. Its API posture is
  partner-gated and matches the London Market pattern: Artificial talks
  publicly and often about APIs as the connective tissue between broker PAS,
  carrier systems and its own platform, and describes real quote-and-bind
  flows in which risk data is pushed to the Artificial platform via API and a
  written line and rate are returned via API, but it publishes no public
  self-serve developer portal, no downloadable OpenAPI or Swagger definition,
  no public Postman collection and no public API host. api.artificial.io and
  developer.artificial.io do not resolve in DNS. The product documentation
  site at docs.artificial.io returns HTTP 200 on its landing page only, which
  states plainly "To view the documentation, you must sign in"; every product
  and reference path 302-redirects to an Auth0 authorization-code login at
  auth.artificialos.com, and docs robots.txt is Disallow all. Its GitHub
  organization, github.com/artificial-labs, exists but has zero public
  repositories. Where Artificial is genuinely and demonstrably standards-forward
  is ACORD: it joined the ACORD Solutions Group Licensed Integrator Partner
  program in October 2023, builds Contract Builder and Smart Placement on a
  structured data model incorporating MRCv3, ACORD GRLC and the Lloyd's Core
  Data Record, validates contracts pre-submission against MRCv3 and ACORD
  standards, and consumes the ACORD Transcriber API for automated data
  extraction. That is the honest shape of this record: real, working,
  standards-aligned insurance APIs that are invisible from outside the
  contractual relationship.
