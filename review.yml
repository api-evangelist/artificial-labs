actions:
  openapiPath: null
  openapiDirectoryOmitted: true
  apisYmlUpdated: true
  reason: |
    apis[] is intentionally empty. Artificial Labs operates real partner APIs and
    is demonstrably ACORD-aligned, but publishes no public self-serve developer
    portal, no retrievable OpenAPI/Swagger, no public API host, no Postman
    collection, no GraphQL endpoint and no event catalog. Listing an API entry
    would require inventing a documentation URL or a base URL that does not
    exist. Recording the gated posture accurately is the correct outcome for this
    record.
